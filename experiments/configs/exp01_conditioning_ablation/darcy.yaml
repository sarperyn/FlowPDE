name: exp01_conditioning_ablation_darcy
seed: 42
device: auto
output_dir: results/experiments/exp01_conditioning_ablation

data:
  generator:
    num_spatial_dims: 2
    num_points: 64
    domain_extent: 1.0
    num_samples: 1000
    seed: 42
    torch_device: cpu
    obs_noise_std: 0.0
    obs_mask_fraction: 1.0
    kappa_alpha: 2.0
    kappa_tau: 3.0
    kappa_scale: 1.0
    kappa_min: 0.1
    f_cutoff: 8
    f_amplitude_min: 0.1
    f_amplitude_max: 5.0
    cg_steps: 500
  splits:
    train: 1000
    val: 200
    test: 200
    train_seed: 101
    val_seed: 202
    test_seed: 303
  loader:
    batch_size: 16
    eval_batch_size: 16
    num_workers: 0
    pin_memory: false
    drop_last: false

model:
  spatial_dim: 2
  spatial_size: 64
  base_channels: 32
  solution_channels: 1
  condition_channels: 2
  max_channels: 256
  use_attention: true
  norm_type: group
  activation: silu

objective:
  base_distribution: gaussian
  path: linear
  time_sampler: uniform
  coupling: independent
  source: gaussian
  sigma: 0.0

training:
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.000001
  optimizer: adamw
  scheduler: cosine
  min_learning_rate: 0.000001
  gradient_clip: 1.0
  use_amp: false
  ema_decay: 0.999
  val_interval: 5
  monitor: rel_l2
  monitor_mode: min
  print_interval: 1
  save_interval: 10

evaluation:
  n_steps: 50
  solver: euler
  metrics:
    - rel_l2
    - h1
    - mae
    - rel_max
  seed: 7
  ensemble_size: 1
  val_max_batches: 4
  test_max_batches:

variants:
  "null":
    conditioner: "null"
    seed_offset: 0
  concat:
    conditioner: concat
    seed_offset: 1000

quick:
  output_dir: results/experiments/exp01_conditioning_ablation_quick
  data:
    generator:
      num_points: 32
      cg_steps: 100
    splits:
      train: 32
      val: 16
      test: 16
    loader:
      batch_size: 8
      eval_batch_size: 8
  model:
    spatial_size: 32
    base_channels: 16
    max_channels: 128
    use_attention: false
  training:
    epochs: 2
    val_interval: 1
    save_interval: 1
  evaluation:
    n_steps: 4
    val_max_batches: 1
    test_max_batches: 1
