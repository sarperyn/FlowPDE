site_name: FlowPDE
site_description: Flow-based generative models for solving PDEs
site_url: https://sarperyn.github.io/FlowPDE/
repo_url: https://github.com/sarperyn/FlowPDE
repo_name: FlowPDE

theme:
  name: material
  logo: assets/branding/flowpde-mark-light.svg
  favicon: assets/branding/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            members_order: source
            heading_level: 3
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - def_list
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sarperyn/FlowPDE

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting_started/installation.md
    - Quickstart: getting_started/quickstart.md
  - Concepts:
    - Architecture Overview: concepts/architecture.md
    - Flow Matching: concepts/flow_matching.md
  - API Reference:
    - api/index.md
    - Core:
      - Base Flow: api/core/base_flow.md
      - Base Solver: api/core/base_solver.md
      - Base Conditioner: api/core/base_conditioner.md
    - Flows:
      - NeuralODEFlow: api/flows/neural_ode.md
      - Components: api/flows/components.md
    - Objectives:
      - Flow Matching: api/objectives/flow_matching.md
      - Maximum Likelihood: api/objectives/maximum_likelihood.md
    - Models:
      - MLP: api/models/mlp.md
      - UNet: api/models/unet.md
      - ConvNet: api/models/convnet.md
      - ResNet: api/models/resnet.md
      - Components: api/models/components.md
    - Solvers:
      - ODE Solvers: api/solvers/ode_solvers.md
    - Trainers:
      - Trainer: api/trainers/trainer.md
      - EMA: api/trainers/ema.md
      - Evaluation: api/trainers/evaluation.md
      - Reflow: api/trainers/reflow.md
    - Datasets:
      - Exponax Integration: api/datasets/exponax.md
      - Normalization: api/datasets/normalization.md
    - Utils:
      - Metrics: api/utils/metrics.md
      - General Utilities: api/utils/utils.md
  - Examples:
    - Notebooks: examples/notebooks.md
