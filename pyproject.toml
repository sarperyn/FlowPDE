[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpde"
version = "0.1.0"
description = "A backend library for normalizing flows solving inverse/forward problems in PDEs"
authors = [
  { name="Sarper Yurtseven" }
]
requires-python = ">=3.11,<4"
dependencies = [
    "torch>=2.0.0",
    "torchdiffeq>=0.2.4",
    "numpy",
    "PyYAML>=6.0",
    "matplotlib",
    "scipy",
    "jax>=0.4.12",
    "exponax>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
]

[tool.setuptools.packages.find]
include = ["flowpde*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that run the PDE solvers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
]
