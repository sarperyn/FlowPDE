[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpde"
dynamic = ["version"]
description = "Flow matching and neural ODEs for forward and inverse PDE problems, built on PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Sarper Yurtseven" }
]
requires-python = ">=3.11"
keywords = [
    "pde",
    "flow-matching",
    "neural-ode",
    "generative-models",
    "inverse-problems",
    "scientific-machine-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0.0",
    "torchdiffeq>=0.2.4",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
# Exponax PDE data generation (flowpde.datasets generators)
data = [
    "jax>=0.4.12",
    "exponax>=0.1.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
]

[project.urls]
Homepage = "https://github.com/sarperyn/FlowPDE"
Documentation = "https://sarperyn.github.io/FlowPDE/"
Repository = "https://github.com/sarperyn/FlowPDE"
Issues = "https://github.com/sarperyn/FlowPDE/issues"
Changelog = "https://github.com/sarperyn/FlowPDE/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "flowpde[data]",
    "pytest>=7.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "flowpde.__version__" }

[tool.setuptools.packages.find]
include = ["flowpde*"]

[tool.setuptools.package-data]
flowpde = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that run the PDE solvers",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Errors and pyflakes only for now; widen once the codebase is clean.
select = ["E9", "F"]
