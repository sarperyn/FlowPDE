# Inference configuration for trained flow matching model
# Usage: python tests/generic_test_inference.py --config configs/inference/unet_poisson_dirichlet_32_inference.yaml

name: unet_poisson_dirichlet
seed: 42
data_dir: data/static/poisson
spatial_dim: 32
model_config:
  class: src.models.unet.UNet
  init_args:
    input_dim: 32
    base_ch: 2
    time_dim: 1
training_config:
  class: src.trainers.flow_matching.FlowMatchingTrainer
dataset_config:
  class: src.datasets.poisson.PoissonDataset
inference_config:
  checkpoint_path: results/training/unet_poisson_dirichlet_32/checkpoints/model_499.pt
  output_dir: results/inference
  n_steps: 50
  integration_method: dopri5
  vis_n_steps: 10
  n_samples: 4
  dpi: 200
  batch_size: 32
  metrics:
  - mse
  - relative_l2
  sample_batch_size: 4
  save_samples: true
