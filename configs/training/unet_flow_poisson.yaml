
# Experiment Name
name: "poisson_dirichlet"
seed: 42

# Data
data_dir: data/static/poisson
spatial_dim: 32

# Model 
model_config:
  class: src.models.unet.UNet
  init_args:
    input_dim: 32
    base_ch: 2
    time_dim: 1
    

# Training
training_config:
  class: src.trainers.flow_matching.FlowMatchingTrainer
  batch_size: 16
  epoch: 500
  print_stats_interval: 10
  save_interval: 500


# Dataset 
dataset_config:
  class: src.datasets.poisson.PoissonDataset

#Optimizer 
optimizer_config:
  class_path: torch.optim.AdamW
  init_args:
    lr: 3.0e-4
    weight_decay: 0.0
    eps: 1.0e-8
    betas: [0.9, 0.999]

#Scheduler
scheduler_config:
  class: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts



